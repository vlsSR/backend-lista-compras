spring.application.name=backend

# Render inyecta la variable PORT automaticamente; en local usara 8080 por defecto
server.port=${PORT:8080}

# La URI de conexion a MongoDB. Por defecto apunta al contenedor Docker local
# (ver docker-compose.yml). Se puede sobreescribir con la variable de entorno MONGODB_URI
# si en algun momento quieres usar un Mongo distinto (ej. Atlas).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shopping_list_db}

# Timeouts razonables para evitar peticiones colgadas indefinidamente
spring.mvc.async.request-timeout=-1
